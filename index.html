<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myléne ❤️</title>

<style>
body{
  margin:0;
  font-family:'Comic Sans MS', cursive;
  background:linear-gradient(to bottom right,#ffb6c1,#ff69b4,#ffc0cb);
  height:100vh;
  height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* ---------- PAGINA'S ---------- */

.container,#yesPage{
  text-align:center;
  width:100%;
}

#yesPage{
  display:none;
  color:white;
  font-size:clamp(1.6rem,5vw,2.6rem);
  text-shadow:2px 2px 5px #d63384;
}

/* ---------- KNOPPEN ---------- */

.buttons{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  margin-top:25px;
  position:relative;
}

button{
  font-family:'Comic Sans MS', cursive;
  font-size:1.3rem;
  padding:14px 32px;
  min-width:110px;
  border:none;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
  transition:transform .2s ease;
  touch-action:none;
}

#yesBtn{
  background:#ff1493;
  color:white;
  transform:scale(1);
  z-index:2;
}

#noBtn{
  background:#fff0f5;
  color:#ff1493;
  position:relative;
  z-index:3;
}

/* ---------- MEDIA ---------- */

.media{
  position:fixed;
  bottom:15px;
  width:320px;
  aspect-ratio:16/9;
  max-width:42vw;
  display:none;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 6px 15px rgba(0,0,0,.4);
  background:black;
  z-index:10;
}

#videoBox{
  left:15px;
}

#gifBox{
  right:15px;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ---------- BALLONNEN ---------- */

.balloon{
  position:absolute;
  width:40px;
  height:55px;
  background:radial-gradient(
    circle at 30% 30%,
    #ff4da6,
    #ff99cc
  );
  border-radius:50% 50% 45% 45%;
  animation:float 6s ease-in-out infinite;
}

@keyframes float{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-60px)
  }
}

/* ---------- VUURWERK ---------- */

.firework{
  position:absolute;
  width:5px;
  height:5px;
  background:yellow;
  border-radius:50%;
  box-shadow:
    0 0 10px orange,
    0 0 18px red;
  animation:explode 1s ease-out forwards;
}

@keyframes explode{
  0%{
    opacity:1;
    transform:translate(0,0);
  }

  100%{
    opacity:0;
    transform:translate(var(--x),var(--y));
  }
}
</style>
</head>

<body>

<!-- ---------- HOOFDPAGINA ---------- -->

<div class="container" id="mainPage">

  <h1>
    Wil je met mij ergens een hapje eten? 💘
  </h1>

  <div class="buttons">
    <button id="yesBtn">Ja!</button>
    <button id="noBtn">Nee</button>
  </div>

</div>


<!-- ---------- JA PAGINA ---------- -->

<div id="yesPage">

  <h1>
    Ik wist dat je ja zou zeggen :) 💞
  </h1>

</div>


<!-- ---------- VIDEO ---------- -->

<div class="media" id="videoBox">

  <video
    id="video"
    src="videoplayback.mp4"
    controls>
  </video>

</div>


<!-- ---------- GIF ---------- -->

<div class="media" id="gifBox">

  <div
    class="tenor-gif-embed"
    data-postid="19622445"
    data-width="100%"
    data-aspect-ratio="1.78">
  </div>

</div>


<script async src="https://tenor.com/embed.js"></script>


<script>

/* ---------- ELEMENTEN ---------- */

const yesBtn =
  document.getElementById("yesBtn");

const noBtn =
  document.getElementById("noBtn");

const main =
  document.getElementById("mainPage");

const yesPage =
  document.getElementById("yesPage");

const videoBox =
  document.getElementById("videoBox");

const gifBox =
  document.getElementById("gifBox");

const video =
  document.getElementById("video");


/* ---------- JA KNOP GROOTTE ---------- */

let yesScale = 1;


/* ---------- NEE KNOP VERPLAATSEN ---------- */

function moveNo(){

  /*
     Maak de Ja-knop iedere keer
     een klein beetje groter.
  */

  yesScale += 0.12;

  yesBtn.style.transform =
    `scale(${yesScale})`;


  /*
     Afmetingen van het scherm.
  */

  const screenWidth =
    window.innerWidth;

  const screenHeight =
    window.innerHeight;


  /*
     Afmetingen van de Nee-knop.
  */

  const noWidth =
    noBtn.offsetWidth;

  const noHeight =
    noBtn.offsetHeight;


  /*
     Ruimte rondom het scherm.
  */

  const padding = 15;


  /*
     Maak de Ja-knop tijdelijk
     zichtbaar op zijn huidige plek.
  */

  const yesRect =
    yesBtn.getBoundingClientRect();


  let newX = 0;
  let newY = 0;

  let foundPosition = false;


  /*
     Probeer maximaal 100 verschillende
     posities te vinden.
  */

  for(let i = 0; i < 100; i++){

    newX =
      padding +
      Math.random() *
      Math.max(
        1,
        screenWidth -
        noWidth -
        padding * 2
      );

    newY =
      padding +
      Math.random() *
      Math.max(
        1,
        screenHeight -
        noHeight -
        padding * 2
      );


    /*
       Controleer of Nee over Ja komt.
    */

    const noRect = {

      left:newX,

      right:
        newX + noWidth,

      top:newY,

      bottom:
        newY + noHeight

    };


    const overlaps =
      noRect.left < yesRect.right &&
      noRect.right > yesRect.left &&
      noRect.top < yesRect.bottom &&
      noRect.bottom > yesRect.top;


    /*
       Als er geen overlap is,
       hebben we een goede plek.
    */

    if(!overlaps){

      foundPosition = true;

      break;

    }

  }


  /*
     Zet de Nee-knop op de nieuwe plek.
  */

  if(foundPosition){

    noBtn.style.position = "fixed";

    noBtn.style.left =
      newX + "px";

    noBtn.style.top =
      newY + "px";

  }

}


/* ---------- COMPUTER ---------- */

/*
   Op een computer springt Nee weg
   zodra je er met je muis overheen gaat.
*/

noBtn.addEventListener(
  "mouseenter",
  moveNo
);


/* ---------- MOBIEL ---------- */

/*
   Op een telefoon bestaat mouseover
   niet op dezelfde manier.

   Daarom gebruiken we pointerdown.
   Dit werkt voor:
   - touchscreen
   - muis
   - tablet
*/

noBtn.addEventListener(
  "pointerdown",
  function(event){

    event.preventDefault();

    moveNo();

  }
);


/* ---------- VUURWERK ---------- */

function firework(x,y,count){

  for(let i = 0; i < count; i++){

    const f =
      document.createElement("div");

    f.className =
      "firework";


    const a =
      Math.random() *
      Math.PI *
      2;


    const r =
      Math.random() * 100;


    f.style.left =
      x + "px";

    f.style.top =
      y + "px";


    f.style.setProperty(
      "--x",
      Math.cos(a) * r + "px"
    );


    f.style.setProperty(
      "--y",
      Math.sin(a) * r + "px"
    );


    document.body.appendChild(f);


    setTimeout(
      () => f.remove(),
      1000
    );

  }

}


/* ---------- BALLONNEN ---------- */

function balloons(n){

  for(let i = 0; i < n; i++){

    const b =
      document.createElement("div");

    b.className =
      "balloon";


    b.style.left =
      Math.random() *
      window.innerWidth +
      "px";


    b.style.top =
      Math.random() *
      window.innerHeight +
      "px";


    document.body.appendChild(b);

  }

}


/* ---------- JA ---------- */

yesBtn.onclick = () => {

  /*
     Hoofdpagina verbergen.
  */

  main.style.display =
    "none";


  /*
     Ja-pagina tonen.
  */

  yesPage.style.display =
    "block";


  /*
     Video en GIF tonen.
  */

  videoBox.style.display =
    "block";

  gifBox.style.display =
    "block";


  /*
     Video opnieuw starten.
  */

  video.pause();

  video.currentTime = 0;

  video.play();


  /*
     Vuurwerk.
  */

  firework(
    window.innerWidth / 2,
    window.innerHeight / 3,
    40
  );


  /*
     Ballonnen.
  */

  setTimeout(
    () => balloons(10),
    1000
  );

};

</script>

</body>
</html>
